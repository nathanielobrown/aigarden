# ailint dogfoods itself: `mise run check` runs `ailint check .` over this repo.
#
# The reference rules would otherwise flag the many *example* doc paths this
# codebase cites on purpose — the grammar docstrings, the test fixtures, and the
# committed snapshots all name illustrative paths under a `docs/` tree that does
# not exist in this repo. Rather than a global exclude (which would blind every
# rule to those files), a
# single override disables just `code-doc-ref` for the files whose whole job is to
# illustrate or capture reference syntax. Every other rule still sees them.
[[overrides]]
files = [
  "tests/**",                        # fixtures + committed snapshots: example paths by design
  "src/references.rs",               # the reference grammars, documented with example paths
  "src/rules/reference_rules.rs",    # each rule's `explain()` example finding cites a sample doc path
  "src/rules/resolve.rs",            # path-resolution helpers, ditto
  "src/rules/descriptive_anchor.rs", # docstring + tests cite example `docs/adrs/*.md` links
  "src/config.rs",                   # config docstrings show example budget/override paths
  "src/cli.rs",                      # `--config` help text names an example path
]
[overrides.code-doc-ref]
enabled = false
