# Rust toolchain comes from rust-toolchain.toml (rustup honours it), so mise pins no tools here.

[tasks.build]
description = "Compile the crate"
run = "cargo build"

[tasks.format]
description = "Format the code in place"
run = "cargo fmt"

[tasks.lint]
description = "Clippy with warnings denied"
run = "cargo clippy --all-targets -- -D warnings"

[tasks.test]
description = "Run the test suite"
run = "cargo test"

[tasks.dogfood]
description = "Run aigarden over its own repo (via aigarden.toml)"
run = "cargo run --quiet -- check ."

[tasks.check]
description = "Full gate: format check + clippy + tests + self-lint"
run = [
  "cargo fmt --check",
  "cargo clippy --all-targets -- -D warnings",
  "cargo test",
  # Dogfood: aigarden must pass its own reference/length rules on this repo.
  "cargo run --quiet -- check .",
]
